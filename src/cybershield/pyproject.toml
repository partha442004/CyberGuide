[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cybershield"
version = "0.1.0"
description = "AI-powered Cybersecurity Career Intelligence Platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "PARTHASARATHI B", email = "partha442004@gmail.com"}
]
requires-python = ">=3.10"
keywords = ["cybersecurity", "career", "jobs", "internships", "ai", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.27",
    "aiosqlite>=0.19.0",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "apscheduler>=3.10.0",
    "streamlit>=1.31.0",
    "plotly>=5.18.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
ai = [
    "sentence-transformers>=2.3.0",
    "scikit-learn>=1.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/partha442004/CyberGuide"
Documentation = "https://docs.cybershield.dev"
Repository = "https://github.com/partha442004/CyberGuide"
Issues = "https://github.com/partha442004/CyberGuide/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cybershield*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses function calls in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
    "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
# Conditional Streamlit imports are required for headless/CLI operation.
"main.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
