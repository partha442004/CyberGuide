apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cybershield-ingress
  namespace: cybershield
  labels:
    app.kubernetes.io/name: cybershield
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.cybershield.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cybershield-api
                port:
                  number: 8000
    - host: dashboard.cybershield.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cybershield-dashboard
                port:
                  number: 8501
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cybershield-websocket-ingress
  namespace: cybershield
  labels:
    app.kubernetes.io/name: cybershield
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "cybershield-api"
spec:
  ingressClassName: nginx
  rules:
    - host: ws.cybershield.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cybershield-api
                port:
                  number: 8000
