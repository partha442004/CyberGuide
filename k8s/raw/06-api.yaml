apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybershield-api
  namespace: cybershield
  labels:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cybershield
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cybershield
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: cybershield-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cybershield-config
            - secretRef:
                name: cybershield-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: cybershield-api
  namespace: cybershield
  labels:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: api
  annotations:
    # Enable Prometheus discovery via the standard scrape annotations
    # (works with prometheus-operator's podmonitor auto-discovery or a
    # plain Prometheus using kubernetes_sd_configs). The API exposes
    # Prometheus text format at /metrics/prometheus.
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics/prometheus
    prometheus.io/port: "8000"
spec:
  selector:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cybershield-api-hpa
  namespace: cybershield
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cybershield-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
