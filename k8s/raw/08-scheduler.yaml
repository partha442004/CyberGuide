apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybershield-scheduler
  namespace: cybershield
  labels:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cybershield
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cybershield
        app.kubernetes.io/component: scheduler
    spec:
      containers:
        - name: scheduler
          image: cybershield-api:latest
          command: ["python", "-m", "cybershield.scheduler"]
          envFrom:
            - configMapRef:
                name: cybershield-config
            - secretRef:
                name: cybershield-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
