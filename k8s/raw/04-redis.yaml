apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybershield-redis
  namespace: cybershield
  labels:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cybershield
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cybershield
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: cybershield-redis
  namespace: cybershield
  labels:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
