apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybershield-elasticsearch
  namespace: cybershield
  labels:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cybershield
      app.kubernetes.io/component: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cybershield
        app.kubernetes.io/component: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-data
          persistentVolumeClaim:
            claimName: cybershield-elasticsearch-data
---
apiVersion: v1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cybershield-elasticsearch-data
  namespace: cybershield
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
kind: Service
metadata:
  name: cybershield-elasticsearch
  namespace: cybershield
  labels:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: elasticsearch
spec:
  selector:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
  type: ClusterIP
