apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybershield-dashboard
  namespace: cybershield
  labels:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cybershield
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cybershield
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: cybershield-api:latest
          command: ["streamlit", "run", "cybershield/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://cybershield-api:8000"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: cybershield-dashboard
  namespace: cybershield
  labels:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app.kubernetes.io/name: cybershield
    app.kubernetes.io/component: dashboard
  ports:
    - port: 8501
      targetPort: 8501
  type: ClusterIP
