apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cybershield.fullname" . }}-dashboard
  labels:
    {{- include "cybershield.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "cybershield.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "cybershield.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          command: ["streamlit", "run", "cybershield/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://{{ include "cybershield.fullname" . }}-api:{{ .Values.api.service.port }}"
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cybershield.fullname" . }}-dashboard
  labels:
    {{- include "cybershield.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cybershield.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: 8501
  type: {{ .Values.dashboard.service.type }}
