{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cybershield.fullname" . }}-scheduler
  labels:
    {{- include "cybershield.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cybershield.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "cybershield.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      containers:
        - name: scheduler
          image: "{{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag }}"
          imagePullPolicy: {{ .Values.scheduler.image.pullPolicy }}
          command: ["python", "-m", "cybershield.scheduler"]
          envFrom:
            - configMapRef:
                name: {{ include "cybershield.fullname" . }}-config
            - secretRef:
                name: {{ include "cybershield.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
{{- end }}
