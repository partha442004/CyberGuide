version: 2
updates:
  # Python dependencies are pinned in requirements.lock (compiled by uv)
  # so CI resolution is reproducible. Dependabot's pip ecosystem would
  # fight that lockfile, so refreshes are handled by the monthly
  # dep-refresh.yml workflow instead: it recompiles the lock from the
  # floating floors in requirements*.txt and opens one reviewable PR.
  # Dependabot security ALERTS (vulnerability reports on main) are a
  # separate repo setting and stay on.
  #
  # GitHub Actions versions — weekly.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
