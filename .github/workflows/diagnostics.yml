name: Diagnostics (manual)

# On-demand authenticated health checks against the production API.
# Runs inside GitHub Actions where CRON_SECRET exists — the secret is
# never exposed locally or in logs (GitHub masks *** automatically).

on:
  workflow_dispatch:
    inputs:
      disable_user1:
        description: "One-time remediation: disable the legacy user1 ghost account (stops daily catch-up spam)"
        type: boolean
        default: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Disable legacy user1 (remediation)
        if: ${{ inputs.disable_user1 }}
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "disabling user1:"
          curl -sS --max-time 30 -X PUT \
            "$API_BASE/api/v1/notifications/preferences/user1" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"is_enabled": false}' | head -c 300
          echo

      - name: Catch-up status (who is stale)
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "catch-up-status:"
          curl -sS --max-time 30 "$API_BASE/api/v1/reports/catch-up-status" \
            -H "X-Cron-Secret: $CRON_SECRET"
          echo

      - name: Email provider status
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "email-status:"
          curl -sS --max-time 30 "$API_BASE/api/v1/notifications/email-status" \
            -H "X-Cron-Secret: $CRON_SECRET"
          echo

      - name: Delivery stats (7 days)
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "notification stats:"
          curl -sS --max-time 30 "$API_BASE/api/v1/notifications/stats?days=7" \
            -H "X-Cron-Secret: $CRON_SECRET" | head -c 800
          echo

      - name: user1 digest history (stamp investigation)
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "user1 last 3 sends:"
          curl -sS --max-time 30 \
            "$API_BASE/api/v1/notifications/preferences/user1/history?limit=3" \
            -H "X-Cron-Secret: $CRON_SECRET" | head -c 600
          echo

      - name: Scraper health
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "scraper-health summary:"
          curl -sS --max-time 30 "$API_BASE/api/v1/observability/scraper-health" \
            -H "X-Cron-Secret: $CRON_SECRET" | head -c 400
          echo
