name: Diagnostics (manual)

# On-demand authenticated health checks against the production API.
# Runs inside GitHub Actions where CRON_SECRET exists — the secret is
# never exposed locally or in logs (GitHub masks *** automatically).

on:
  workflow_dispatch:
    inputs:
      disable_user1:
        description: "One-time remediation: disable the legacy user1 ghost account (stops daily catch-up spam)"
        type: boolean
        default: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Disable legacy user1 (remediation)
        if: ${{ inputs.disable_user1 }}
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "disabling user1:"
          curl -sS --max-time 30 -X PUT \
            "$API_BASE/api/v1/notifications/preferences/user1" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"is_enabled": false}' | head -c 300
          echo

      - name: Catch-up status (who is stale)
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "catch-up-status:"
          curl -sS --max-time 30 "$API_BASE/api/v1/reports/catch-up-status" \
            -H "X-Cron-Secret: $CRON_SECRET"
          echo

      - name: Email provider status
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "email-status:"
          curl -sS --max-time 30 "$API_BASE/api/v1/notifications/email-status" \
            -H "X-Cron-Secret: $CRON_SECRET"
          echo

      - name: Delivery stats (7 days)
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "notification stats:"
          curl -sS --max-time 30 "$API_BASE/api/v1/notifications/stats?days=7" \
            -H "X-Cron-Secret: $CRON_SECRET" | head -c 800
          echo

      - name: user1 digest history (stamp investigation)
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "user1 last 3 sends:"
          curl -sS --max-time 30 \
            "$API_BASE/api/v1/notifications/preferences/user1/history?limit=3" \
            -H "X-Cron-Secret: $CRON_SECRET" | head -c 600
          echo

      - name: Owner telegram digest proof (real history path)
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Fires a real digest-send endpoint with a telegram-only override
          # (one-off, never touches saved prefs). This writes a
          # notification_history row like the real cron send — proving the
          # table-tag fix end-to-end. before/after counters make the delta
          # visible in this log.
          #
          # Target is the legacy `user1` account, NOT the owner: the owner
          # has instant_alerts enabled, so digests deliberately skip
          # Telegram for them (results {} — dedup working as designed).
          # user1's legacy prefs still route digests through Telegram,
          # which is exactly the path that produced the 0/51 failures.
          BEFORE=$(curl -sS --max-time 30 "$API_BASE/api/v1/notifications/stats?days=30" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['per_channel'].get('telegram',{}).get('delivered',0))")
          TARGET=user1
          echo "target: $TARGET, telegram delivered before: $BEFORE"
          # The owner's digest only includes jobs discovered AFTER their
          # last send this morning — without a fresh discovery run the
          # send would be a quiet-day no-op. Run one targeted discovery
          # for the owner's domain first (best-effort).
          curl -sS --max-time 90 -X POST \
            "$API_BASE/api/v1/jobs/discovery/run?query=security%20analyst%20bangalore" \
            -H "X-Cron-Secret: $CRON_SECRET" | head -c 200
          echo
          if [ -n "$TARGET" ]; then
            curl -sS --max-time 60 -X POST \
              "$API_BASE/api/v1/notifications/preferences/$TARGET/send-alert" \
              -H "Content-Type: application/json" -H "X-Cron-Secret: $CRON_SECRET" \
              -d '{"channels":["telegram"],"domains":["security"]}' | head -c 400
            echo
            AFTER=$(curl -sS --max-time 30 "$API_BASE/api/v1/notifications/stats?days=30" \
              -H "X-Cron-Secret: $CRON_SECRET" \
              | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['per_channel'].get('telegram',{}).get('delivered',0))")
            echo "telegram delivered after: $AFTER (was $BEFORE)"
            if [ "$AFTER" -gt "$BEFORE" ]; then
              echo "✅ owner telegram digest DELIVERED — table-tag fix verified end-to-end"
            else
              echo "⚠️ telegram counter did not advance — check send-alert output above"
            fi
          else
            echo "owner user id not found — skipping send"
          fi

      - name: Scraper health
        env:
          API_BASE: https://cyberguide-api.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "scraper-health summary:"
          curl -sS --max-time 30 "$API_BASE/api/v1/observability/scraper-health" \
            -H "X-Cron-Secret: $CRON_SECRET" | head -c 400
          echo
