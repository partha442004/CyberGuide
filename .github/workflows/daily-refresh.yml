name: Daily refresh (Vercel auto-refresh)

# Replaces the always-on APScheduler worker that used to run on Railway.
# Vercel is serverless, so nothing runs in the background there. This free
# GitHub Actions cron keeps the live app's data fresh. Discovery + cleanup
# run three times a day so the dashboard's listings stay fresh, but the
# EMAIL DIGEST is sent ONCE per day (08:00 IST): members asked for a single
# daily mail, not three. The slot-less /reports/daily call applies each
# user's own saved domains (a GRC user gets GRC, a data user gets data) and
# the no-duplicates window prevents repeats. No weekly recap — one mail a
# day is the whole deal.
# Vercel auto-deploys every push, so this always targets the latest code.
on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST — discovery + cleanup + THE daily digest
    - cron: '30 7 * * *'   # 13:00 IST — discovery + cleanup only (no email)
    - cron: '30 13 * * *'  # 19:00 IST — discovery + cleanup + owner summary
  workflow_dispatch:      # allow manual "Run workflow" from the Actions tab

# The archive step commits the day's job history into the repo
# (archive/YYYY/MM/YYYY-MM-DD.json) — needs write access.
permissions:
  contents: write

jobs:
  refresh:
    name: Trigger discovery + daily report
    runs-on: ubuntu-latest
    env:
      API_BASE: https://cyberguide-api.vercel.app
      # Shared secret the API requires on every maintenance endpoint
      # (X-Cron-Secret). Set in BOTH GitHub Actions secrets and Vercel env.
      # Unset on either side → API keeps the endpoints open (no breakage).
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      # Per-user discovery: the API derives search queries from every enabled
      # account's preferred domains + skills (e.g. a cybersecurity user gets
      # 'soc analyst', 'vapt', 'penetration testing' searches), falling back
      # to the classic fixed queries when no accounts exist yet.
      - name: Run job discovery (per-user queries)
        run: |
          curl -sSf --max-time 290 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/api/v1/jobs/discovery/run-for-users" \
            || echo "per-user discovery failed or timed out"

      # Vercel is serverless, so the scheduler's ``archive_old_jobs`` /
      # ``deactivate_expired_jobs`` functions never run there. This curl
      # does the same cleanup: jobs first seen more than 14 days ago are
      # moved to the expired_jobs archive table, keeping the live listings
      # fresh and the dashboard's "Expired" page populated.
      - name: Archive expired jobs (keep listings fresh)
        run: |
          curl -sSf --max-time 120 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/api/v1/jobs/archive-expired?days=14" \
            && echo "expired jobs archived OK" \
            || echo "archive step failed or timed out"

      # Archiving only deactivates + copies; rows stay forever and Neon's
      # free tier has hard storage limits. This deletes jobs rows that have
      # been inactive for 30+ days and their expired_jobs copies. Safe:
      # re-send protection comes from NotificationHistory URL snapshots.
      - name: Purge long-archived jobs (free-tier storage cap)
        run: |
          curl -sSf --max-time 120 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/api/v1/jobs/purge-archived?days=30" \
            && echo "archived jobs purged OK" \
            || echo "purge step failed or timed out"

      # Same serverless story as above: the scheduler's closing-soon sweep
      # only runs inside APScheduler, which never executes on Vercel. This
      # curl fires the identical sweep through the public API (morning +
      # evening, matching the scheduler's 04:30/12:30 UTC triggers) so
      # "🚨 Closing soon" digests reach users on the live deployment.
      # Serverless story, part 3: the scheduler's nightly link verification
      # (``verify_job_links``) only runs inside APScheduler, which never
      # executes on Vercel. This curl runs the same sweep through the public
      # API — it checks the least-recently-verified active job links, skips
      # bot-blocked hosts (Indeed/Internshala/etc. 403 the server IP) and
      # deactivates only jobs whose pages are definitively gone (404/410),
      # so digests stop carrying dead postings. Bounded to ~12 links per run.
      - name: Verify job links (deactivate dead postings)
        run: |
          curl -sSf --max-time 120 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/api/v1/jobs/verify-links" \
            && echo "link verification OK" \
            || echo "link verification failed or timed out"

      - name: Closing-soon alerts sweep
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
        run: |
          curl -sSf --max-time 120 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/api/v1/notifications/closing-soon" \
            && echo "closing-soon sweep ran OK" \
            || echo "closing-soon sweep failed or timed out"

      # Daily owner summary: the owner gets one compact email — sends, jobs,
      # opens and email-applies for the day — so "did everyone get their mail
      # today?" is answered automatically instead of needing the dashboard.
      - name: Owner daily delivery summary
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 13 * * *'
        run: |
          curl -sSf --max-time 120 -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/api/v1/notifications/daily-summary" \
            && echo "daily owner summary OK" \
            || echo "daily owner summary failed or timed out"

      # THE daily digest — sent once per day (08:00 IST / manual triggers).
      # No ``?slot=`` parameter: each member's own saved domains apply
      # (security, grc, coding, data, ...), which is what they signed up for.
      # The weekly recap was removed: one mail per day is the deal (Resend
      # free tier = 3,000/month; /reports/weekly-alert stays available for
      # manual runs from the dashboard or Actions dispatch).
      - name: Generate the daily digest (per-user domains)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
        run: |
          curl -sSf --max-time 290 -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/api/v1/reports/daily" > /dev/null \
            && echo "daily digest generated + sent OK" \
            || echo "daily digest failed or timed out"

      # SELF-HEAL: GitHub's cron scheduler occasionally skips a slot entirely
      # (it dropped the 08:00 IST run once). When the morning digest step
      # never executes, members get NO mail that day and the only recovery
      # was the owner manually curling the endpoint. On the two afternoon
      # slots this step asks the API whether any enabled member's digest is
      # stale (>12h since their last send) and fires /reports/daily only
      # then. It is a no-op on normal days — the status endpoint is read-only
      # and "no" means zero extra emails — and a failed status check skips
      # the catch-up instead of spamming.
      - name: Catch-up digest if the morning run was skipped
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 7 * * *' || github.event.schedule == '30 13 * * *'
        run: |
          STATUS=$(curl -sS --max-time 30 \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/api/v1/reports/catch-up-status" \
            || echo '{"needs_catch_up": false}')
          echo "catch-up status: $STATUS"
          if echo "$STATUS" | grep -q '"needs_catch_up": *true'; then
            echo "missed digest detected — firing catch-up"
            curl -sSf --max-time 290 -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/api/v1/reports/daily" > /dev/null \
              && echo "catch-up digest sent OK" \
              || echo "catch-up digest failed or timed out"
          else
            echo "all members got their digest — no catch-up needed"
          fi

      # ── Daily job archive ─────────────────────────────────────────────
      # Commit the day's delivered-jobs document into the repo at
      # archive/YYYY/MM/YYYY-MM-DD.json (user-wise, anonymized member
      # keys — the repo is public so no emails/names ever land in git).
      # Runs only on the morning slot (post-digest), skips the commit on
      # quiet days, and [skip ci] prevents an infinite workflow loop.
      - name: Check out repo (for the archive commit)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
        uses: actions/checkout@v4

      - name: Commit daily job archive
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -sS --max-time 60 \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/api/v1/archive/daily-archive" -o /tmp/daily_archive.json \
            || { echo "archive fetch failed"; exit 0; }
          # Parse with python: FastAPI JSON is minified (no space after
          # ":"), so a textual grep for the zero-totals case is fragile.
          MEMBERS=$(python3 -c "import json;print(json.load(open('/tmp/daily_archive.json'))['totals']['members_with_jobs'])") \
            || { echo "archive JSON unparseable"; exit 0; }
          if [ "$MEMBERS" -eq 0 ]; then
            echo "no jobs delivered today — nothing to archive"
            exit 0
          fi
          DATE=$(python3 -c "import json;print(json.load(open('/tmp/daily_archive.json'))['date'])")
          YEAR=${DATE%%-*}
          MONTH=$(echo "$DATE" | cut -d- -f2)
          DEST="archive/${YEAR}/${MONTH}/${DATE}/daily-jobs.json"
          mkdir -p "$(dirname "$DEST")"
          cp /tmp/daily_archive.json "$DEST"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "archive unchanged — no commit needed"
          else
            git commit -m "archive: daily jobs for ${DATE} [skip ci]"
            git push || echo "archive push failed (non-fatal)"
          fi
