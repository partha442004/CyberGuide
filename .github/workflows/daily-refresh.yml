name: Daily refresh (Vercel auto-refresh)

# Replaces the always-on APScheduler worker that used to run on Railway.
# Vercel is serverless, so nothing runs in the background there. This free
# GitHub Actions cron keeps the live app's data fresh by hitting the public
# discovery + report endpoints three times a day (GitHub cron is UTC, so
# these are the India/Kolkata IST times converted to UTC, -5h30m).
# Vercel auto-deploys every push, so this always targets the latest code.
on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST — discovery: cybersecurity
    - cron: '30 7 * * *'   # 13:00 IST — discovery: software engineering
    - cron: '30 13 * * *'  # 19:00 IST — discovery: python developer
  workflow_dispatch:      # allow manual "Run workflow" from the Actions tab

jobs:
  refresh:
    name: Trigger discovery + daily report
    runs-on: ubuntu-latest
    env:
      API_BASE: https://cyberguide-api.vercel.app
    steps:
      - name: Run job discovery (cybersecurity)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
        run: |
          curl -sSf --max-time 290 -X POST \
            "$API_BASE/api/v1/jobs/discovery/run?query=cybersecurity" \
            || echo "discovery (cybersecurity) failed or timed out"

      - name: Run job discovery (software engineering)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 7 * * *'
        run: |
          curl -sSf --max-time 290 -X POST \
            "$API_BASE/api/v1/jobs/discovery/run?query=software%20engineering" \
            || echo "discovery (software engineering) failed or timed out"

      - name: Run job discovery (python developer)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 13 * * *'
        run: |
          curl -sSf --max-time 290 -X POST \
            "$API_BASE/api/v1/jobs/discovery/run?query=python%20developer" \
            || echo "discovery (python developer) failed or timed out"

      - name: Generate daily report (sends email/Telegram digest)
        run: |
          curl -sSf --max-time 290 "$API_BASE/api/v1/reports/daily" > /dev/null \
            && echo "daily report generated OK" \
            || echo "report generation failed or timed out"
