name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies (pinned lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Ruff check
        run: ruff check src/ tests/ dashboard/

      - name: Ruff format check
        run: ruff format --check src/ tests/ dashboard/

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies (pinned lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Mypy (interntrack + cybershield)
        run: |
          export PYTHONPATH=src
          mypy src/interntrack src/cybershield

  security:
    name: Security (bandit + safety + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install security tools
        # safety pinned to <3 (v3 replaced `check` with `scan`) to match
        # requirements-dev.txt and keep the gate deterministic
        run: python -m pip install bandit "safety>=2.3.0,<3"

      - name: Bandit scan (medium+ severities)
        run: bandit -r src/ scripts/ dashboard/ -ll -q

      - name: Safety dependency scan
        # The lock pins what CI actually installs; scanning it (plus the raw
        # floors for provenance) is the authoritative vulnerability gate.
        run: safety check -r requirements.lock -r requirements.txt -r requirements-dev.txt --full-report

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest

      - name: Trivy filesystem scan (HIGH/CRITICAL)
        run: trivy fs --severity HIGH,CRITICAL --exit-code 1 --skip-dirs tests,dashboard,data,migrations src/

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check version sources agree
        run: python scripts/check_versions.py

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, version]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies (pinned lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run full test suite (InternTrack + CyberGuide)
        env:
          PYTHONPATH: src
        run: |
          pytest tests src/cybershield/tests -q -p no:cacheprovider -o addopts='' \
            --cov=interntrack --cov=cybershield \
            --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  smoke:
    name: Smoke (live API boot)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, version, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies (pinned lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Boot API and run smoke checks
        run: python scripts/smoke_test.py
