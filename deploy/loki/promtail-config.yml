# Promtail configuration — ships container logs from the Docker socket to Loki.
# Runs in the `monitoring` compose profile alongside Loki.
#
# Reference: https://grafana.com/docs/loki/latest/send-data/promtail/configuration/

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Persisted across restarts so already-shipped lines are not re-sent.
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    # Auto-discover every running container via the mounted Docker socket.
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    # The app emits structured JSON lines (structlog JSONRenderer, keyed
    # `timestamp` + `level`), so parse those fields into labels. docker_sd
    # returns the raw container line, so non-JSON lines (e.g. uvicorn plain
    # access logs) simply pass through and fall back to receive time.
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
    relabel_configs:
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
