[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cybershield"
version = "1.20.8"
description = "Internship & Job Tracker with AI-powered discovery"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "PARTHASARATHI B", email = "parthasarathi442004@gmail.com" }
]
keywords = ["internship", "job-tracker", "career", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "playwright>=1.40.0",
    "pandas>=2.1.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
    "tenacity>=8.2.0",
    "cryptography>=41.0.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
notifications = [
    "python-telegram-bot>=20.0",
    "discord.py>=2.3.0",
    "slack-sdk>=3.26.0",
]
ai = [
    "google-generativeai>=0.3.0",
    "ollama>=0.1.0",
]
dashboard = [
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]
all = [
    "interntrack[notifications,ai,dashboard,dev]",
]

[project.urls]
Homepage = "https://github.com/partha442004/CyberGuide"
Documentation = "https://docs.cybershield.dev"
Repository = "https://github.com/partha442004/CyberGuide"

[project.scripts]
interntrack = "interntrack.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/interntrack"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["S101", "COM812"]

[tool.ruff.lint.isort]
known-first-party = ["interntrack"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses function calls in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
    "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
# str+Enum subclasses are used deliberately for Pydantic compatibility.
"src/interntrack/domain/enums.py" = ["UP042"]
"src/cybershield/domain/enums.py" = ["UP042"]
# Tests: private-member access, fixture arg names, and test secrets are idiomatic.
"tests/**" = ["SLF001", "ARG001", "ARG002", "S105"]
"tests/unit/test_*.py" = ["DTZ001", "DTZ006"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
# Pragmatic strictness: type-check untyped code for real errors without
# requiring every function and generic to be fully annotated.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_explicit = false
disallow_any_generics = false
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Third-party modules without type stubs are imported at runtime only when
# their optional feature is enabled.
module = [
    "apscheduler.*",
    "bs4",
    "elasticsearch",
    "elasticsearch.*",
    "feedparser",
    "google",
    "google.generativeai",
    "pymupdf",
    "structlog",
    "streamlit",
    "plotly",
    "plotly.*",
    "pandas",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --cov=interntrack --cov-report=term-missing"

[tool.coverage.run]
source = ["interntrack", "cybershield"]
# SQLAlchemy async engines execute DB work inside greenlets; without this,
# coverage.py's tracer drops lines after `await` on async handlers, silently
# under-reporting (e.g. cybershield API endpoints showed ~57-62% while tests
# exercised them fully). With concurrency=greenlet the true coverage is
# measured (verified: api/v1/notifications.py 62% -> 100%).
concurrency = ["greenlet"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
