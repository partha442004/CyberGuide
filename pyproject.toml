[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cybershield"
version = "1.0.0"
description = "Internship & Job Tracker with AI-powered discovery"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "PARTHASARATHI B", email = "maxxermogging@gmail.com" }
]
keywords = ["internship", "job-tracker", "career", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "playwright>=1.40.0",
    "pandas>=2.1.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
    "tenacity>=8.2.0",
    "cryptography>=41.0.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
notifications = [
    "python-telegram-bot>=20.0",
    "discord.py>=2.3.0",
    "slack-sdk>=3.26.0",
]
ai = [
    "google-generativeai>=0.3.0",
    "ollama>=0.1.0",
]
dashboard = [
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]
all = [
    "interntrack[notifications,ai,dashboard,dev]",
]

[project.urls]
Homepage = "https://github.com/partha442004/cybershield"
Documentation = "https://docs.cybershield.dev"
Repository = "https://github.com/partha442004/cybershield"

[project.scripts]
interntrack = "interntrack.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/interntrack"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["interntrack"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=interntrack --cov-report=term-missing"

[tool.coverage.run]
source = ["interntrack"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
