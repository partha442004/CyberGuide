<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#667eea" />
  <title>CyberGuide — Install</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CyberGuide" />
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(1200px 600px at 20% -10%, #667eea55, transparent),
                  radial-gradient(900px 500px at 110% 110%, #764ba255, transparent),
                  #0f172a; color: #e2e8f0;
    }
    .card {
      background: #1e293bcc; backdrop-filter: blur(12px);
      border: 1px solid #334155; border-radius: 20px;
      padding: 40px 44px; max-width: 420px; text-align: center;
      box-shadow: 0 30px 60px #00000055;
    }
    .logo { font-size: 56px; margin-bottom: 12px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px;
         background: linear-gradient(90deg, #667eea, #764ba2);
         -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.55; margin-bottom: 20px; }
    .btn {
      display: block; width: 100%; padding: 14px; border-radius: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
      font-weight: 700; font-size: 15px; text-decoration: none; margin-bottom: 10px;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px #667eea66; }
    .btn.ghost { background: transparent; border: 1px solid #334155; color: #cbd5e1; }
    .hint { font-size: 12px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📊</div>
    <h1>CyberGuide</h1>
    <p>AI-powered internship &amp; job tracking — resume matching, daily alerts by domain &amp; location, team referrals.</p>
    <a class="btn" href="https://cyberguide2026aug.streamlit.app/">Open Dashboard</a>
    <a class="btn ghost" href="https://cyberguide-api.vercel.app/health">Check API</a>
    <p class="hint">
      📱 iPhone: open this page in Safari → Share → <strong>Add to Home Screen</strong>.<br />
      Android: Chrome → ⋮ → <strong>Add to Home screen / Install app</strong>.
    </p>
  </div>
</body>
</html>
