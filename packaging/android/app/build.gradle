plugins {
    id "com.android.application"
}

// Release signing: credentials are read from keystore.properties (gitignored)
// so the keystore + password never land in version control.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.cyberguide.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.cyberguide.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.21.0"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.11.0"
    // Force a single Kotlin stdlib version (appcompat brings 1.8.22 while a
    // transitive dep pulls 1.6.21, which duplicates classes).
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because "transitive 1.6.21 duplicates classes with kotlin-stdlib 1.8.22"
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because "transitive 1.6.21 duplicates classes with kotlin-stdlib 1.8.22"
        }
    }
}
