services:
  - type: web
    name: cyberguide-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn interntrack.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PYTHONPATH
        value: "src"
      - key: DATABASE_URL
        fromDatabase:
          name: cyberguide-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "InternTrack"
      - key: APP_VERSION
        value: "1.20.8"
      - key: REQUIRE_API_KEY
        value: "false"

databases:
  - name: cyberguide-db
    plan: free
    databaseName: cyberguide
    ipAllowList: []
