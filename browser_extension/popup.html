<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberGuide Job Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/logo.svg" alt="CyberGuide" class="logo">
      <h1>CyberGuide</h1>
      <p class="subtitle">Job Saver</p>
    </div>

    <div id="job-form" class="form">
      <div class="form-group">
        <label for="job-title">Job Title *</label>
        <input type="text" id="job-title" placeholder="e.g., Security Engineer" required>
      </div>

      <div class="form-group">
        <label for="company">Company *</label>
        <input type="text" id="company" placeholder="e.g., Google" required>
      </div>

      <div class="form-group">
        <label for="url">Job URL</label>
        <input type="url" id="url" placeholder="https://...">
      </div>

      <div class="form-group">
        <label for="location">Location</label>
        <input type="text" id="location" placeholder="e.g., Bangalore, India">
      </div>

      <div class="form-group">
        <label for="salary">Salary Range</label>
        <input type="text" id="salary" placeholder="e.g., ₹5,00,000 - ₹10,00,000">
      </div>

      <div class="form-group">
        <label for="tags">Skills/Tags</label>
        <input type="text" id="tags" placeholder="e.g., python, security, aws">
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Any additional notes..."></textarea>
      </div>

      <div class="button-group">
        <button id="save-btn" class="btn btn-primary">
          <span class="btn-text">Save Job</span>
          <span class="btn-loading" style="display: none;">Saving...</span>
        </button>
        <button id="cancel-btn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>

    <div id="success-message" class="message success" style="display: none;">
      <div class="message-icon">✓</div>
      <h3>Job Saved!</h3>
      <p>The job has been saved to your CyberGuide account.</p>
      <button id="view-jobs-btn" class="btn btn-primary">View Saved Jobs</button>
    </div>

    <div id="error-message" class="message error" style="display: none;">
      <div class="message-icon">✕</div>
      <h3>Error</h3>
      <p id="error-text">Failed to save job.</p>
    </div>

    <div class="footer">
      <p>Powered by <a href="https://cyberguide-api.vercel.app" target="_blank">CyberGuide</a></p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
